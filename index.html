<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website đang bảo trì</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #2563eb);
            color: white;
            padding: 20px;
        }

        .maintenance {
            width: 100%;
            max-width: 600px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 50px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .icon {
            font-size: 75px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #e5e7eb;
        }

        .status {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(255,255,255,0.15);
            font-size: 15px;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #cbd5e1;
        }

        @media (max-width: 600px) {
            .maintenance {
                padding: 40px 20px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }

            .icon {
                font-size: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="maintenance">

        <div class="icon">🔧</div>

        <h1>Website đang bảo trì</h1>

        <p>
            Chúng tôi đang tiến hành nâng cấp và bảo trì hệ thống
            để mang đến trải nghiệm tốt hơn cho bạn
        </p>

        <div class="status">
            ⏳ Vui lòng quay lại sau ít phút
        </div>

        <div class="footer">
            Xin lỗi vì sự bất tiện này.
        </div>

    </div>

</body>
</html>
