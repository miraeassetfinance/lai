
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website đang bảo trì</title>
  <meta http-equiv="refresh" content="5;url=https://tinhlaisuat.github.io/tinhlaipl/">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;color:#1f2937}
    .box{width:min(92%,520px);background:#fff;border-radius:18px;padding:42px 30px;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.08)}
    .icon{font-size:52px;margin-bottom:12px}
    h1{margin:0 0 14px;font-size:28px;color:#111827}
    p{margin:9px 0;line-height:1.6;font-size:16px}
    .redirect{margin-top:22px;padding:13px 16px;border-radius:10px;background:#f3f4f6;font-size:15px}
    .count{font-weight:700}
    a{display:inline-block;margin-top:20px;padding:12px 22px;border-radius:9px;background:#111827;color:#fff;text-decoration:none;font-weight:600}
    a:hover{opacity:.9}
    .small{margin-top:16px;font-size:13px;color:#6b7280}
  </style>
</head>
<body>
  <main class="box">
    <div class="icon">🔧</div>
    <h1>WEBSITE ĐANG BẢO TRÌ</h1>
    <p>Hệ thống đang được bảo trì để nâng cấp và cập nhật.</p>
    <p><strong>Vui lòng chờ trong giây lát, hệ thống đang chuyển bạn đến trang dự phòng.</strong></p>
    <div class="redirect">Tự động chuyển sau <span class="count" id="count">10</span> giây...</div>
    <a href="https://tinhlaisuat.github.io/tinhlaipl/">Truy cập trang dự phòng ngay</a>
    <div class="small">Nếu trình duyệt không tự chuyển, vui lòng bấm nút bên trên.</div>
  </main>
  <script>
    let seconds = 10;
    const count = document.getElementById('count');
    const timer = setInterval(() => {
      seconds--;
      count.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.replace('https://tinhlaisuat.github.io/tinhlaipl/');
      }
    }, 1000);
  </script>
</body>
</html>
